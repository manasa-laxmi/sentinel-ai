<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SentinelAI</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { width: 320px; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
    header h1 { font-size: 15px; flex: 1; }
    main { padding: 14px 16px 16px; display: grid; gap: 12px; }
    .status { display: flex; gap: 10px; align-items: center; padding: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .status.on .dot { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    .status.paused .dot { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-bg); }
    .status b { display: block; font-size: 13.5px; }
    .status small { color: var(--muted); font-size: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; font-size: 13.5px; }
    .row + .row { border-top: 1px solid var(--line); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; }
    .stat { padding: 12px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat b { font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    footer small { color: var(--muted); font-size: 11.5px; display: block; }
    .linkbtn { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h1>SentinelAI</h1>
    <label class="switch" title="Turn SentinelAI on or off everywhere">
      <input type="checkbox" id="enabled" aria-label="SentinelAI on or off">
      <span></span>
    </label>
  </header>

  <main>
    <div class="card status" id="status">
      <div class="dot"></div>
      <div><b id="statusTitle">Checking this page…</b><small id="statusText"></small></div>
    </div>

    <div class="card" id="siteCard" hidden>
      <div class="row">
        <span id="siteLabel">Protect this site</span>
        <label class="switch"><input type="checkbox" id="siteToggle" aria-labelledby="siteLabel"><span></span></label>
      </div>
      <div class="row">
        <span id="liveLabel">Warn me while I type</span>
        <label class="switch"><input type="checkbox" id="liveToggle" aria-labelledby="liveLabel"><span></span></label>
      </div>
    </div>

    <div class="card" id="vaultCard" hidden>
      <div class="row">
        <span id="vaultText">Remembering replaced details</span>
        <button class="btn" id="forget" style="padding:5px 10px">Forget now</button>
      </div>
    </div>

    <div class="card stats">
      <div class="stat"><b id="found">0</b><span>items caught</span></div>
      <div class="stat"><b id="replaced">0</b><span>messages cleaned</span></div>
    </div>

    <footer>
      <span>
        <button class="linkbtn" id="howItWorks">How it works</button>
        <small>Runs only on your device</small>
      </span>
      <button class="btn" id="openSettings">Settings</button>
    </footer>
  </main>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
